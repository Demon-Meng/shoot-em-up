<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打飞机大战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #0a0a2e;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameContainer {
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        canvas {
            display: block;
            background: #0a0a2e;
        }
        #ui {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 16px;
            padding: 8px 12px;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
            pointer-events: none;
            z-index: 10;
        }
        #ui span { white-space: nowrap; }
        #startScreen, #gameOverScreen, #pauseScreen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 20;
            padding: 20px;
        }
        #gameOverScreen, #pauseScreen { display: none; }
        .title {
            font-size: clamp(28px, 8vw, 48px);
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            margin-bottom: 16px;
        }
        .subtitle {
            font-size: clamp(13px, 3.5vw, 18px);
            color: #aaa;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            padding: 14px 36px;
            font-size: clamp(16px, 4vw, 20px);
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.95); }
        .score-display {
            font-size: clamp(24px, 6vw, 36px);
            color: #ffcc00;
            margin: 16px 0;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }
        .instructions {
            margin-top: 16px;
            text-align: left;
            font-size: clamp(11px, 2.8vw, 13px);
            color: #bbb;
            max-width: 340px;
            width: 90%;
        }
        .inst-section { margin-bottom: 10px; }
        .inst-title {
            color: #00d4ff;
            font-size: clamp(12px, 3vw, 14px);
            margin-bottom: 4px;
            font-weight: bold;
        }
        .inst-row {
            padding: 2px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .inst-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px; height: 20px;
            border-radius: 50%;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            flex-shrink: 0;
        }
        #mobileControls {
            display: none;
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 15;
            padding: 2.5vw 3vw 3.5vw;
            pointer-events: none;
        }
        .mobile-btns {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }
        .mobile-btns .group {
            display: flex;
            gap: 2.5vw;
            pointer-events: auto;
        }
        .mobile-btns .group.mid {
            gap: 2vw;
            align-self: center;
        }
        .mobile-btn {
            width: clamp(48px, 14vw, 72px);
            height: clamp(48px, 14vw, 72px);
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            color: rgba(255,255,255,0.7);
            font-size: clamp(18px, 5vw, 28px);
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
            flex-shrink: 0;
        }
        .mobile-btn.fire {
            background: rgba(255,60,60,0.25);
            border-color: rgba(255,60,60,0.5);
            color: rgba(255,100,100,0.8);
            width: clamp(54px, 16vw, 82px);
            height: clamp(54px, 16vw, 82px);
        }
        .mobile-btn.sm {
            width: clamp(38px, 10vw, 52px);
            height: clamp(38px, 10vw, 52px);
            font-size: clamp(12px, 3.5vw, 18px);
            opacity: 0.7;
        }
        .mobile-btn.md {
            width: clamp(52px, 15vw, 70px);
            height: clamp(52px, 15vw, 70px);
            font-size: clamp(20px, 6vw, 30px);
            opacity: 0.8;
        }
        .mobile-btn:active { background: rgba(255,255,255,0.3); }
        .mobile-btn.fire:active { background: rgba(255,60,60,0.5); }
        .mobile-btn.sm:active { opacity: 1; }
        .mobile-btn.md:active { opacity: 1; }
        @media (hover: none) and (pointer: coarse) {
            #mobileControls { display: block; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <span id="scoreText">分数: 0</span>
            <span id="fireModeText" style="font-size:13px; opacity:0.7;">自动 ON</span>
            <span id="livesText">❤❤❤</span>
        </div>
        <div id="startScreen">
            <div class="title">打飞机大战</div>
            <div class="subtitle">消灭敌机，保卫家园</div>
            <button class="btn" id="btnStart">开始游戏</button>
            <div class="instructions">
                <div class="inst-section">
                    <div class="inst-title">道具说明</div>
                    <div class="inst-row"><span class="inst-icon" style="background:#ffcc00;">P</span> 升级火力（最高三连发）</div>
                    <div class="inst-row"><span class="inst-icon" style="background:#ff4488;">❤</span> 恢复一条生命</div>
                    <div class="inst-row"><span class="inst-icon" style="background:#00ccff;">S</span> 护盾5秒，持续抵挡所有伤害</div>
                    <div class="inst-row"><span class="inst-icon" style="background:#ff8800;">B</span> 炸弹+1，清屏全灭敌机</div>
                </div>
                <div class="inst-section">
                    <div class="inst-title">操作说明</div>
                    <div class="inst-row" id="instDesktop">WASD移动 · 空格射击 · B炸弹 · P暂停 · R切换射击</div>
                    <div class="inst-row" id="instMobile">触摸移动+自动射击 · 左⏸暂停 · 右B炸弹</div>
                </div>
            </div>
        </div>
        <div id="gameOverScreen">
            <div class="title" style="color:#ff4444;">游戏结束</div>
            <div class="score-display" id="finalScore">0</div>
            <button class="btn" id="btnRestart">再来一局</button>
        </div>
        <div id="pauseScreen">
            <div class="title">暂停</div>
            <div class="subtitle">点击继续</div>
        </div>
        <div id="mobileControls">
            <div class="mobile-btns">
                <div class="group">
                    <div class="mobile-btn md" id="btnPause">⏸</div>
                </div>
                <div class="group">
                    <div class="mobile-btn md" id="btnBomb" style="color:#ffa500;">B</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const CW = 480, CH = 700; // logical size
    let scale = 1;

    function resizeCanvas() {
        const vw = window.innerWidth, vh = window.innerHeight;
        const aspect = CW / CH;
        let w, h;
        if (vw / vh < aspect) {
            w = vw; h = vw / aspect;
        } else {
            h = vh; w = vh * aspect;
        }
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        canvas.width = CW;
        canvas.height = CH;
        scale = w / CW;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game state
    let player, bullets, enemies, enemyBullets, particles, powerups, stars;
    let score, lives, level, spawnTimer, gameOver, paused, animFrame;
    let keys = {};
    let autoFire = true;
    let fireTimer = 0;
    const FIRE_RATE = 8;
    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    // Show correct instructions
    if (isMobile) {
        document.getElementById('instDesktop').style.display = 'none';
    } else {
        document.getElementById('instMobile').style.display = 'none';
    }

    // Stars
    function initStars() {
        stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * CW,
                y: Math.random() * CH,
                s: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5
            });
        }
    }

    function drawStars() {
        ctx.fillStyle = '#fff';
        stars.forEach(s => {
            ctx.globalAlpha = Math.random() * 0.5 + 0.3;
            ctx.fillRect(s.x, s.y, s.s, s.s);
            s.y += s.speed;
            if (s.y > CH) { s.y = 0; s.x = Math.random() * CW; }
        });
        ctx.globalAlpha = 1;
    }

    // Player
    function createPlayer() {
        return { x: CW / 2, y: CH - 80, w: 40, h: 40, speed: 6, power: 1, invincible: 0, shield: 0, shieldTimer: 0, bombs: 2 };
    }

    function drawPlayer() {
        if (player.invincible > 0 && Math.floor(player.invincible) % 4 < 2) return;
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.fillStyle = '#00d4ff';
        ctx.beginPath();
        ctx.moveTo(0, -22); ctx.lineTo(-18, 18); ctx.lineTo(-6, 12);
        ctx.lineTo(0, 20); ctx.lineTo(6, 12); ctx.lineTo(18, 18);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.moveTo(0, -14); ctx.lineTo(-6, 4); ctx.lineTo(6, 4);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.moveTo(-5, 18); ctx.lineTo(5, 18); ctx.lineTo(0, 26 + Math.random() * 4);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        // Shield
        if (player.shieldTimer > 0) {
            const flashing = player.shieldTimer <= 120;
            const visible = !flashing || Math.floor(player.shieldTimer / 6) % 2 === 0;
            if (visible) {
                ctx.save();
                ctx.strokeStyle = `rgba(0, 200, 255, ${0.4 + Math.sin(Date.now() / 200) * 0.2})`;
                ctx.lineWidth = 3;
                ctx.shadowColor = '#00ccff';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(player.x, player.y, 30, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }
    }

    // Bullets
    function fireBullet() {
        if (player.power >= 3) {
            bullets.push({ x: player.x, y: player.y - 20, w: 4, h: 12, speed: 10, dx: 0 });
            bullets.push({ x: player.x - 12, y: player.y - 10, w: 4, h: 12, speed: 10, dx: -1 });
            bullets.push({ x: player.x + 12, y: player.y - 10, w: 4, h: 12, speed: 10, dx: 1 });
        } else if (player.power >= 2) {
            bullets.push({ x: player.x - 8, y: player.y - 20, w: 4, h: 12, speed: 10, dx: 0 });
            bullets.push({ x: player.x + 8, y: player.y - 20, w: 4, h: 12, speed: 10, dx: 0 });
        } else {
            bullets.push({ x: player.x, y: player.y - 20, w: 4, h: 14, speed: 10, dx: 0 });
        }
    }

    function drawBullet(b) {
        const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
        grad.addColorStop(0, '#00ffff');
        grad.addColorStop(1, '#0066ff');
        ctx.fillStyle = grad;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 8;
        ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
    }

    // Enemies
    function spawnEnemy() {
        const types = [
            { w: 32, h: 32, hp: 1, speed: 2, score: 100, color: '#ff4444' },
            { w: 40, h: 40, hp: 2, speed: 1.5, score: 200, color: '#ff8800' },
            { w: 50, h: 50, hp: 4, speed: 1, score: 500, color: '#cc00ff' }
        ];
        const type = types[Math.min(Math.floor(Math.random() * (1 + level / 3)), 2)];
        enemies.push({
            x: Math.random() * (CW - 60) + 30, y: -40,
            w: type.w, h: type.h,
            hp: type.hp, maxHp: type.hp,
            speed: type.speed + Math.random() * 0.5 + level * 0.1,
            score: type.score, color: type.color,
            dx: (Math.random() - 0.5) * 2
        });
    }

    function drawEnemy(e) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(0, e.h / 2); ctx.lineTo(-e.w / 2, -e.h / 4);
        ctx.lineTo(-e.w / 4, -e.h / 2); ctx.lineTo(e.w / 4, -e.h / 2);
        ctx.lineTo(e.w / 2, -e.h / 4); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, -8, 4, 4);
        ctx.fillRect(2, -8, 4, 4);
        if (e.hp < e.maxHp) {
            ctx.fillStyle = '#333';
            ctx.fillRect(-e.w / 2, -e.h / 2 - 8, e.w, 4);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(-e.w / 2, -e.h / 2 - 8, e.w * (e.hp / e.maxHp), 4);
        }
        ctx.restore();
    }

    // Particles
    function explode(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 1, color,
                size: Math.random() * 4 + 2
            });
        }
    }

    // Powerups
    function spawnPowerup(x, y) {
        if (Math.random() < 0.15) {
            const r = Math.random();
            const type = r < 0.4 ? 'power' : r < 0.65 ? 'life' : r < 0.88 ? 'shield' : 'bomb';
            powerups.push({ x, y, w: 20, h: 20, speed: 1.5, type });
        }
    }

    function drawPowerup(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        const colors = { power: '#ffcc00', life: '#ff4488', shield: '#00ccff', bomb: '#ff8800' };
        const labels = { power: 'P', life: '❤', shield: 'S', bomb: 'B' };
        ctx.fillStyle = colors[p.type];
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(labels[p.type], 0, 1);
        ctx.restore();
    }

    // Collision
    function collide(a, b) {
        return a.x - a.w / 2 < b.x + b.w / 2 &&
               a.x + a.w / 2 > b.x - b.w / 2 &&
               a.y - a.h / 2 < b.y + b.h / 2 &&
               a.y + a.h / 2 > b.y - b.h / 2;
    }

    // Game control
    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('gameOverScreen').style.display = 'none';
        document.getElementById('pauseScreen').style.display = 'none';
        player = createPlayer();
        bullets = []; enemies = []; enemyBullets = []; particles = []; powerups = [];
        score = 0; lives = 3; level = 1; spawnTimer = 0;
        gameOver = false; paused = false;
        bombEffect = null;
        initStars();
        if (animFrame) cancelAnimationFrame(animFrame);
        gameLoop();
    }

    function endGame() {
        gameOver = true;
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('finalScore').textContent = '最终分数: ' + score;
    }

    function togglePause() {
        if (gameOver) return;
        paused = !paused;
        document.getElementById('pauseScreen').style.display = paused ? 'flex' : 'none';
    }

    function useBomb() {
        if (gameOver || paused || player.bombs <= 0) return;
        player.bombs--;
        // Create bomb effect
        bombEffect = { x: player.x, y: player.y, timer: 0, maxTimer: 60 };
        // Massive particles
        for (let i = 0; i < 80; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 8 + 3;
            particles.push({
                x: player.x, y: player.y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 1, color: ['#ff8800', '#ffcc00', '#ff4400', '#fff'][Math.floor(Math.random() * 4)],
                size: Math.random() * 6 + 3
            });
        }
        // Destroy all enemies and enemy bullets
        enemies.forEach(e => {
            score += e.score;
            explode(e.x, e.y, e.color, 10);
        });
        enemies = [];
        enemyBullets.forEach(b => explode(b.x, b.y, '#ff4444', 4));
        enemyBullets = [];
    }

    let bombEffect = null;
    function drawBombEffect() {
        if (!bombEffect) return;
        const t = bombEffect.timer;
        const maxR = Math.max(CW, CH);
        const progress = t / bombEffect.maxTimer;

        // Expanding shockwave ring
        const ringR = progress * maxR * 0.8;
        const ringAlpha = Math.max(0, 1 - progress);
        ctx.save();
        ctx.strokeStyle = `rgba(255, 200, 50, ${ringAlpha})`;
        ctx.lineWidth = 8 * (1 - progress);
        ctx.shadowColor = '#ff8800';
        ctx.shadowBlur = 20 * (1 - progress);
        ctx.beginPath();
        ctx.arc(bombEffect.x, bombEffect.y, ringR, 0, Math.PI * 2);
        ctx.stroke();

        // Inner glow
        const innerAlpha = ringAlpha * 0.3;
        const grad = ctx.createRadialGradient(
            bombEffect.x, bombEffect.y, 0,
            bombEffect.x, bombEffect.y, ringR * 0.6
        );
        grad.addColorStop(0, `rgba(255, 255, 200, ${innerAlpha})`);
        grad.addColorStop(0.5, `rgba(255, 150, 0, ${innerAlpha * 0.5})`);
        grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bombEffect.x, bombEffect.y, ringR * 0.6, 0, Math.PI * 2);
        ctx.fill();

        // Screen flash overlay
        const flashAlpha = ringAlpha * 0.4;
        ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        ctx.fillRect(0, 0, CW, CH);
        ctx.restore();

        bombEffect.timer++;
        if (bombEffect.timer >= bombEffect.maxTimer) bombEffect = null;
    }

    // Buttons (onclick for reliability on both mobile and desktop)
    document.getElementById('btnStart').addEventListener('click', startGame);
    document.getElementById('btnRestart').addEventListener('click', startGame);
    document.getElementById('pauseScreen').addEventListener('click', togglePause);

    // Keyboard input
    document.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'Space') e.preventDefault();
        if (['KeyW','KeyS','KeyA','KeyD'].includes(e.code)) usingMouse = false;
        if (e.code === 'KeyP') togglePause();
        if (e.code === 'KeyR') autoFire = !autoFire;
        if (e.code === 'KeyB') useBomb();
    });
    document.addEventListener('keyup', e => keys[e.code] = false);

    // Mouse input
    let mouseX = CW / 2, mouseY = CH / 2, usingMouse = false, mouseDown = false;
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.clientX - rect.left) * (CW / rect.width);
        mouseY = (e.clientY - rect.top) * (CH / rect.height);
        usingMouse = true;
    });
    canvas.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
    canvas.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

    // Touch on canvas - drag to move
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.touches[0].clientX - rect.left) * (CW / rect.width);
        mouseY = (e.touches[0].clientY - rect.top) * (CH / rect.height);
        usingMouse = true;
        mouseDown = true;
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.touches[0].clientX - rect.left) * (CW / rect.width);
        mouseY = (e.touches[0].clientY - rect.top) * (CH / rect.height);
        usingMouse = true;
    }, { passive: false });
    canvas.addEventListener('touchend', e => {
        e.preventDefault();
        mouseDown = false;
    }, { passive: false });

    // Mobile buttons
    let mobileLeft = false, mobileRight = false, mobileUp = false, mobileDown = false, mobileFire = false;
    function bindBtn(id, setter) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); setter(true); }, { passive: false });
        el.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); setter(false); }, { passive: false });
        el.addEventListener('touchcancel', e => { e.preventDefault(); setter(false); }, { passive: false });
    }
    document.getElementById('btnPause').addEventListener('click', e => { e.stopPropagation(); togglePause(); });
    document.getElementById('btnBomb').addEventListener('click', e => { e.stopPropagation(); useBomb(); });

    // Prevent all default touch on document to stop pull-to-refresh and scrolling
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // Update
    function update() {
        if (gameOver || paused) return;

        // Player movement
        if (usingMouse) {
            player.x += (mouseX - player.x) * 0.15;
            player.y += (mouseY - player.y) * 0.15;
        } else {
            if (keys['KeyA'] || mobileLeft) player.x -= player.speed;
            if (keys['KeyD'] || mobileRight) player.x += player.speed;
            if (keys['KeyW'] || mobileUp) player.y -= player.speed;
            if (keys['KeyS'] || mobileDown) player.y += player.speed;
        }
        player.x = Math.max(player.w / 2, Math.min(CW - player.w / 2, player.x));
        player.y = Math.max(player.h / 2, Math.min(CH - player.h / 2, player.y));
        if (player.invincible > 0) player.invincible--;
        if (player.shieldTimer > 0) player.shieldTimer--;

        // Fire
        fireTimer++;
        if ((keys['Space'] || mouseDown || autoFire || mobileFire) && fireTimer >= FIRE_RATE) {
            fireBullet();
            fireTimer = 0;
        }

        // Bullets
        bullets.forEach(b => { b.y -= b.speed; b.x += b.dx; });
        bullets = bullets.filter(b => b.y > -20 && b.x > -10 && b.x < CW + 10);

        // Spawn enemies
        spawnTimer++;
        if (spawnTimer > Math.max(20, 60 - level * 5)) {
            spawnEnemy();
            spawnTimer = 0;
        }

        level = Math.floor(score / 1000) + 1;

        // Enemies
        enemies.forEach(e => {
            e.y += e.speed;
            e.x += e.dx;
            if (e.x < e.w / 2 || e.x > CW - e.w / 2) e.dx *= -1;
            if (Math.random() < 0.005 + level * 0.003) {
                enemyBullets.push({
                    x: e.x, y: e.y + e.h / 2,
                    w: 6, h: 10,
                    speed: 3 + level * 0.3
                });
            }
        });

        enemyBullets.forEach(b => { b.y += b.speed; });
        enemyBullets = enemyBullets.filter(b => b.y < CH + 20);

        // Bullet-Enemy collision
        bullets.forEach(b => {
            enemies.forEach(e => {
                if (e.hp > 0 && collide(b, e)) {
                    e.hp--;
                    b.y = -100;
                    if (e.hp <= 0) {
                        score += e.score;
                        explode(e.x, e.y, e.color, 12);
                        spawnPowerup(e.x, e.y);
                    } else {
                        explode(b.x, b.y, '#fff', 3);
                    }
                }
            });
        });
        enemies = enemies.filter(e => e.hp > 0 && e.y < CH + 50);

        // Player hit detection
        if (player.invincible <= 0) {
            enemies.forEach(e => {
                if (collide(player, e)) {
                    e.hp = 0;
                    if (player.shieldTimer > 0) {
                        explode(player.x, player.y, '#00ccff', 10);
                    } else {
                        lives--;
                        player.power = Math.max(1, player.power - 1);
                        player.invincible = 120;
                        explode(player.x, player.y, '#00d4ff', 20);
                        if (lives <= 0) endGame();
                    }
                }
            });
            enemyBullets = enemyBullets.filter(b => {
                if (collide(player, { x: b.x, y: b.y, w: b.w, h: b.h })) {
                    if (player.shieldTimer > 0) {
                        explode(player.x, player.y, '#00ccff', 8);
                    } else {
                        lives--;
                        player.power = Math.max(1, player.power - 1);
                        player.invincible = 120;
                        explode(player.x, player.y, '#ff4444', 15);
                        if (lives <= 0) endGame();
                    }
                        player.power = Math.max(1, player.power - 1);
                        explode(player.x, player.y, '#ff4444', 15);
                        if (lives <= 0) endGame();
                    }
                    player.invincible = 120;
                    return false;
                }
                return true;
            });
        }

        // Powerups
        powerups.forEach(p => { p.y += p.speed; });
        powerups = powerups.filter(p => {
            if (collide(player, { x: p.x, y: p.y, w: 24, h: 24 })) {
                if (p.type === 'power') player.power = Math.min(3, player.power + 1);
                else if (p.type === 'life') lives = Math.min(5, lives + 1);
                else if (p.type === 'shield') { player.shieldTimer = 300; player.shield = 1; }
                else player.bombs = Math.min(3, player.bombs + 1);
                explode(p.x, p.y, '#ffcc00', 8);
                return false;
            }
            return p.y < CH + 20;
        });

        // Particles
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; });
        particles = particles.filter(p => p.life > 0);

        // UI
        document.getElementById('scoreText').textContent = '分数: ' + score;
        document.getElementById('livesText').textContent = '❤'.repeat(lives) +
            (player.shieldTimer > 0 ? ' 🛡' : '') +
            (player.bombs > 0 ? ' 💣×' + player.bombs : '');
        document.getElementById('fireModeText').textContent = autoFire ? '自动 ON' : '手动';
        document.getElementById('fireModeText').style.color = autoFire ? '#0f0' : '#f80';
    }

    // Draw
    function draw() {
        ctx.fillStyle = '#0a0a2e';
        ctx.fillRect(0, 0, CW, CH);
        drawStars();
        bullets.forEach(drawBullet);
        enemies.forEach(drawEnemy);
        enemyBullets.forEach(b => {
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 6;
            ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.h);
            ctx.shadowBlur = 0;
        });
        powerups.forEach(drawPowerup);
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        });
        ctx.globalAlpha = 1;
        drawPlayer();
        drawBombEffect();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '14px Arial';
        ctx.textAlign = 'right';
        ctx.fillText('Level ' + level, CW - 10, 45);
    }

    // Loop
    function gameLoop() {
        update();
        draw();
        animFrame = requestAnimationFrame(gameLoop);
    }

    // Menu bg
    initStars();
    function menuLoop() {
        ctx.fillStyle = '#0a0a2e';
        ctx.fillRect(0, 0, CW, CH);
        drawStars();
        if (!gameOver) requestAnimationFrame(menuLoop);
    }
    menuLoop();
    </script>
</body>
</html>
